<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>鋪草皮遊戲 — 實境桌遊版</title>
    <style>
        :root {
            --studio-bg: #26292e;
            --panel-dark: #181a1d;
            --panel-border: rgba(255, 255, 255, 0.22);
            --stone-tile: #b5ada0;
            --grid-line: #3b3732;
            --neon-lime: #d8ff2e;

            --p0-color: #3b82f6;
            --p1-color: #f59e0b;
            --p2-color: #ef4444;
            --p3-color: #a855f7;
        }

        /* 徹底封鎖 iOS Safari 長按選字、放大鏡與系統彈出選單 */
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
        }

        html, body {
            overscroll-behavior: none;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100dvh;
            margin: 0;
            padding: 8px 8px calc(16px + env(safe-area-inset-bottom, 0px)) 8px;
            color: #f3f4f6;
            background-color: var(--studio-bg);
            background-image: 
                radial-gradient(circle at 50% 25%, rgba(255,255,255,0.05) 0%, transparent 65%),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 4px),
                repeating-linear-gradient(90deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 1px, transparent 1px, transparent 4px);
        }

        .chamfer-sm {
            clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
        }
        .chamfer-md {
            clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
        }

        /* 頂部標題與功能列 */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 95vw;
            max-width: 560px;
            margin-bottom: 6px;
        }
        .title-group {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .title-group h2 {
            margin: 0;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 1.2px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        .title-sub {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #9ca3af;
        }
        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .btn-icon {
            background: var(--panel-dark);
            color: #d1d5db;
            border: 1px solid var(--panel-border);
            width: 30px;
            height: 28px;
            border-radius: 6px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .btn-end {
            background: linear-gradient(180deg, #eab308 0%, #ca8a04 100%);
            color: #111827;
            border: none;
            padding: 5px 11px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        /* 4人即時記分板 */
        #scoreboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            width: 95vw;
            max-width: 560px;
            margin-bottom: 6px;
        }
        .score-card {
            position: relative;
            background: var(--panel-dark);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            padding: 5px 3px 4px 3px;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s, background-color 0.2s;
            overflow: hidden;
        }
        .score-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3.5px;
        }
        .score-card.p0::before { background: var(--p0-color); }
        .score-card.p1::before { background: var(--p1-color); }
        .score-card.p2::before { background: var(--p2-color); }
        .score-card.p3::before { background: var(--p3-color); }

        .score-card.active-turn {
            background: #272b33;
            border-color: rgba(255,255,255,0.65);
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.45);
        }

        .score-name {
            font-weight: 800;
            font-size: 11px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .p-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .score-meta {
            color: #d1d5db;
            font-size: 10px;
            font-variant-numeric: tabular-nums;
            margin-bottom: 3px;
        }
        .ticket-count {
            color: #facc15;
            font-weight: 700;
        }
        .score-badge {
            display: inline-block;
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 800;
            background: #111315;
            color: #6b7280;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .score-badge.qualified {
            background: var(--neon-lime);
            color: #111827;
            border-color: #ffffff;
            box-shadow: 0 0 8px rgba(216, 255, 46, 0.5);
        }

        /* 回合廣播提示條 */
        #turn-indicator {
            width: 95vw;
            max-width: 560px;
            padding: 6px 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            background: var(--panel-dark);
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 3px 8px rgba(0,0,0,0.4);
            transition: all 0.25s;
        }
        .banner-p0 { border-left: 6px solid var(--p0-color) !important; border-right: 6px solid var(--p0-color) !important; }
        .banner-p1 { border-left: 6px solid var(--p1-color) !important; border-right: 6px solid var(--p1-color) !important; }
        .banner-p2 { border-left: 6px solid var(--p2-color) !important; border-right: 6px solid var(--p2-color) !important; }
        .banner-p3 { border-left: 6px solid var(--p3-color) !important; border-right: 6px solid var(--p3-color) !important; }

        @keyframes pulseAlert {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.72; }
        }
        .banner-steal {
            background: #7f1d1d !important;
            border-color: #ef4444 !important;
            color: #ffffff !important;
            animation: pulseAlert 1s infinite;
        }
        .banner-swap {
            background: #422006 !important;
            border-color: #facc15 !important;
            color: #fef08a !important;
            animation: pulseAlert 1.2s infinite;
        }

        /* 後續 5 片草皮預告列 */
        .queue-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 95vw;
            max-width: 560px;
            background: var(--panel-dark);
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 6px;
            padding: 4px 6px;
            margin-bottom: 6px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .queue-bar.swap-active {
            border-color: #facc15;
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.35);
            background: #252218;
        }
        .queue-label {
            font-size: 9px;
            color: #9ca3af;
            font-weight: 800;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 1px;
            flex-shrink: 0;
        }
        .queue-list {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            flex: 1;
        }
        .queue-item {
            position: relative;
            background: #111316;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 4px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2px;
            cursor: default;
        }
        .queue-bar.swap-active .queue-item {
            cursor: pointer;
            border: 1.5px dashed #facc15;
            background: #1f1c12;
        }
        .queue-num {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: 8px;
            color: #6b7280;
            font-weight: 800;
        }
        .queue-grid { display: grid; gap: 1px; pointer-events: none; }
        .q-cell { width: 5px; height: 5px; }
        .q-cell.filled {
            background: #2e8b47;
            border: 0.5px solid #143d1f;
        }

        /* 操控區：可拖曳的八角切角草皮托盤 + 戰術按鍵 */
        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 95vw;
            max-width: 560px;
            margin-bottom: 8px;
        }

        .tray-outer {
            position: relative;
            width: 72px;
            height: 72px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.65);
            padding: 2.5px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.55);
            cursor: grab;
            touch-action: none;
            transition: transform 0.15s, opacity 0.25s;
        }
        .tray-outer:active {
            cursor: grabbing;
            transform: scale(0.94);
        }
        .tray-inner {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #262a2e 0%, #141619 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .tray-hint {
            position: absolute;
            bottom: 2px;
            font-size: 9px;
            font-weight: 800;
            color: #facc15;
            letter-spacing: 0.5px;
        }
        #mini-preview {
            display: grid;
            gap: 0px;
            justify-content: center;
            align-content: center;
            margin-bottom: 8px;
        }
        .mini-cell {
            width: 11px;
            height: 11px;
        }
        .mini-cell.filled {
            background-color: #2f8e4b;
            background-image: radial-gradient(rgba(255,255,255,0.18) 1px, transparent 0);
            background-size: 3px 3px;
            border: 1px solid #13381d;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
        }

        /* 拖曳時跟隨手指的浮動草皮幽靈 */
        #drag-ghost {
            position: fixed;
            display: none;
            pointer-events: none;
            z-index: 999;
            transform: translate(-50%, -135%);
            filter: drop-shadow(0 10px 14px rgba(0,0,0,0.75));
        }
        .ghost-cell {
            width: 18px;
            height: 18px;
        }
        .ghost-cell.filled {
            background-color: #2f8e4b;
            background-image: radial-gradient(rgba(255,255,255,0.22) 1px, transparent 0);
            background-size: 4px 4px;
            border: 1.5px solid #102415;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            flex: 1;
        }
        .btn-grid button {
            background: linear-gradient(180deg, #2b3038 0%, #1d2026 100%);
            color: #f3f4f6;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 6px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 2px 5px rgba(0,0,0,0.35);
            touch-action: manipulation;
        }
        .btn-grid button:active:not(:disabled) {
            transform: scale(0.97);
            background: #373d47;
        }
        .btn-grid button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .btn-grid button.btn-ticket {
            border-color: rgba(250, 204, 21, 0.55);
            color: #fde047;
        }
        .btn-grid button.btn-ticket.canceling {
            background: #7f1d1d;
            border-color: #ef4444;
            color: #ffffff;
        }
        .btn-grid button.btn-gift {
            border-color: rgba(52, 211, 153, 0.45);
            color: #6ee7b7;
        }

        /* 釘選預覽時的快速確認浮動條 */
        #confirm-bar {
            display: none;
            width: 95vw;
            max-width: 560px;
            gap: 8px;
            margin-bottom: 6px;
        }
        #confirm-bar.visible {
            display: flex;
        }
        #btn-confirm-place {
            flex: 2;
            background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
            color: #052e16;
            border: none;
            padding: 9px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(34, 197, 94, 0.4);
        }
        #btn-confirm-place:disabled {
            background: #4b5563;
            color: #9ca3af;
            box-shadow: none;
            cursor: not-allowed;
        }
        #btn-cancel-pin {
            flex: 1;
            background: #374151;
            color: #e5e7eb;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 9px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        /* 做舊實木外框 + 20x20 石板棋盤 (自動避開 Safari 底部網址列) */
        .board-wood-frame {
            position: relative;
            width: min(94vw, 47dvh, 520px);
            padding: 9px;
            border-radius: 4px;
            background: 
                repeating-linear-gradient(90deg, rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 2px, transparent 2px, transparent 7px),
                linear-gradient(135deg, #5c5043 0%, #443b31 45%, #362e26 100%);
            box-shadow: 
                0 14px 32px rgba(0,0,0,0.75),
                inset 0 1px 1px rgba(255,255,255,0.22),
                inset 0 -2px 4px rgba(0,0,0,0.6);
            border: 1px solid #26201a;
        }

        .board-recess {
            padding: 3px;
            background: #24201c;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.85);
        }

        #board {
            position: relative;
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            width: 100%;
            background-color: var(--grid-line);
            border: 1px solid var(--grid-line);
            touch-action: none;
            cursor: crosshair;
        }

        .cell {
            position: relative;
            aspect-ratio: 1;
            background-color: var(--stone-tile);
            border-right: 1px solid var(--grid-line);
            border-bottom: 1px solid var(--grid-line);
            box-shadow: inset 1px 1px 0 rgba(255,255,255,0.22);
        }

        /* 花崗岩死地石頭 */
        .stone {
            background-color: #57534e;
            background-image: radial-gradient(circle at 30% 30%, #78716c 0%, #44403c 70%, #292524 100%);
            box-shadow: inset 1.5px 1.5px 2px rgba(255,255,255,0.25), inset -2px -2px 3px rgba(0,0,0,0.7);
        }
        .stone::after {
            content: '';
            position: absolute;
            inset: 22%;
            border-radius: 3px;
            border: 1px solid rgba(0,0,0,0.35);
            background: repeating-linear-gradient(45deg, rgba(0,0,0,0.18) 0 2px, transparent 2px 4px);
        }

        /* 搶奪卡 */
        .steal-card {
            background: radial-gradient(circle at center, #ffffff 45%, #e5e7eb 100%);
            box-shadow: inset 0 0 0 1.5px #9ca3af;
        }
        .steal-card::after {
            content: '⚔';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(8px, 2.4vw, 12px);
            color: #b91c1c;
            font-weight: 900;
        }

        /* 擬真人工草皮拼圖 */
        .placed {
            z-index: 2;
            background-color: #2d8a49;
            background-image: 
                radial-gradient(rgba(255,255,255,0.16) 1px, transparent 0),
                radial-gradient(rgba(10, 35, 16, 0.26) 1px, transparent 0);
            background-size: 4px 4px;
            background-position: 0 0, 2px 2px;
            border-right: 1px solid rgba(12, 36, 18, 0.32);
            border-bottom: 1px solid rgba(12, 36, 18, 0.32);
            box-shadow: none;
        }
        .placed::after { content: none; }

        .placed-p0 { background-color: #268259; }
        .placed-p1 { background-color: #3a8f3d; }
        .placed-p2 { background-color: #277d42; }
        .placed-p3 { background-color: #2c7a63; }

        .edge-top    { border-top: 2px solid #102415 !important; }
        .edge-right  { border-right: 2px solid #102415 !important; }
        .edge-bottom { border-bottom: 2px solid #102415 !important; }
        .edge-left   { border-left: 2px solid #102415 !important; }

        .piece-anchor::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.75);
            z-index: 4;
        }
        .placed-p0.piece-anchor::before { background: var(--p0-color); }
        .placed-p1.piece-anchor::before { background: var(--p1-color); }
        .placed-p2.piece-anchor::before { background: var(--p2-color); }
        .placed-p3.piece-anchor::before { background: var(--p3-color); }

        /* 放置預覽 */
        .preview-valid-p0 { background: rgba(59, 130, 246, 0.75) !important; box-shadow: inset 0 0 0 1.5px #bfdbfe; z-index: 5; }
        .preview-valid-p1 { background: rgba(245, 158, 11, 0.75) !important; box-shadow: inset 0 0 0 1.5px #fef08a; z-index: 5; }
        .preview-valid-p2 { background: rgba(239, 68, 68, 0.75) !important; box-shadow: inset 0 0 0 1.5px #fecaca; z-index: 5; }
        .preview-valid-p3 { background: rgba(168, 85, 247, 0.75) !important; box-shadow: inset 0 0 0 1.5px #e9d5ff; z-index: 5; }

        .preview-invalid {
            background: rgba(220, 38, 38, 0.8) !important;
            box-shadow: inset 0 0 0 1.5px #fecaca;
            z-index: 5;
        }

        .steal-target-preview {
            outline: 2.5px solid #ef4444;
            outline-offset: -1px;
            transform: scale(1.18);
            z-index: 15;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.9);
        }

        /* 5x5 達成霓虹萊姆綠外框 */
        .glow-top    { border-top: 2.5px solid var(--neon-lime) !important; z-index: 6; }
        .glow-right  { border-right: 2.5px solid var(--neon-lime) !important; z-index: 6; }
        .glow-bottom { border-bottom: 2.5px solid var(--neon-lime) !important; z-index: 6; }
        .glow-left   { border-left: 2.5px solid var(--neon-lime) !important; z-index: 6; }
        .in-5x5 {
            box-shadow: inset 0 0 8px rgba(216, 255, 46, 0.38);
        }

        .board-5x5-badge {
            position: absolute;
            transform: translate(-4px, -110%);
            background: #141619;
            color: #ffffff;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 6px;
            border: 1.5px solid #d4af37;
            clip-path: polygon(5px 0, calc(100% - 5px) 0, 100% 5px, 100% calc(100% - 5px), calc(100% - 5px) 100%, 5px 100%, 0 calc(100% - 5px), 0 5px);
            box-shadow: 0 3px 8px rgba(0,0,0,0.75);
            pointer-events: none;
            z-index: 20;
            white-space: nowrap;
        }

        #toast {
            position: fixed;
            top: 12px;
            background: #141619;
            color: var(--neon-lime);
            border: 1.5px solid var(--neon-lime);
            padding: 8px 16px;
            font-weight: 800;
            font-size: 13px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.65);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            transform: translateY(-10px);
            z-index: 150;
            max-width: 90vw;
            text-align: center;
        }
        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 12, 15, 0.82);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
        }
        .modal-box {
            background: #1c1f24;
            border: 1.5px solid #d4af37;
            padding: 20px;
            width: 92%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0,0,0,0.8);
        }
        .modal-box h3 { margin: 0 0 10px 0; color: #facc15; font-size: 19px; }
        .gift-targets { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
        .gift-target-btn {
            border: 1px solid rgba(255,255,255,0.25);
            padding: 11px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 800;
            color: white;
            cursor: pointer;
        }
        .btn-cancel-modal {
            width: 100%;
            background: #374151;
            color: #e5e7eb;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .result-list {
            text-align: left;
            margin: 14px 0;
            background: #121417;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 6px;
            line-height: 1.9;
            font-size: 13px;
        }
        .winner-banner {
            font-size: 16px;
            font-weight: 800;
            color: var(--neon-lime);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="toast" class="chamfer-sm"></div>
    <div id="drag-ghost"></div>

    <div class="header-bar">
        <div class="title-group">
            <h2>鋪草皮遊戲</h2>
            <span class="title-sub">TURF LAYING · v2.1</span>
        </div>
        <div class="header-actions">
            <button class="btn-icon" id="btn-sound" onclick="toggleSound()" title="音效開關">🔊</button>
            <button class="btn-end chamfer-sm" onclick="endGame()">結算勝負</button>
        </div>
    </div>

    <!-- 4人即時記分板 -->
    <div id="scoreboard">
        <div class="score-card p0 active-turn" id="card-p0">
            <div class="score-name"><span class="p-dot" style="background:var(--p0-color)"></span>玩家 1</div>
            <div class="score-meta"><span id="tiles-p0">0格</span> ｜ <span class="ticket-count" id="tickets-p0">🎫×1</span></div>
            <div class="score-badge" id="badge-p0">未達 5×5</div>
        </div>
        <div class="score-card p1" id="card-p1">
            <div class="score-name"><span class="p-dot" style="background:var(--p1-color)"></span>玩家 2</div>
            <div class="score-meta"><span id="tiles-p1">0格</span> ｜ <span class="ticket-count" id="tickets-p1">🎫×1</span></div>
            <div class="score-badge" id="badge-p1">未達 5×5</div>
        </div>
        <div class="score-card p2" id="card-p2">
            <div class="score-name"><span class="p-dot" style="background:var(--p2-color)"></span>玩家 3</div>
            <div class="score-meta"><span id="tiles-p2">0格</span> ｜ <span class="ticket-count" id="tickets-p2">🎫×1</span></div>
            <div class="score-badge" id="badge-p2">未達 5×5</div>
        </div>
        <div class="score-card p3" id="card-p3">
            <div class="score-name"><span class="p-dot" style="background:var(--p3-color)"></span>玩家 4</div>
            <div class="score-meta"><span id="tiles-p3">0格</span> ｜ <span class="ticket-count" id="tickets-p3">🎫×1</span></div>
            <div class="score-badge" id="badge-p3">未達 5×5</div>
        </div>
    </div>
    
    <div id="turn-indicator" class="chamfer-sm banner-p0">輪到 玩家 1 (藍色) — 拖曳或點擊棋盤</div>

    <!-- 後續 5 片草皮預告列 -->
    <div class="queue-bar" id="queue-bar">
        <div class="queue-label">後續5片</div>
        <div class="queue-list" id="queue-list"></div>
    </div>

    <!-- 可直接拖曳的八角切角草皮托盤 + 2x2 戰術控制鍵 -->
    <div class="controls">
        <div class="tray-outer chamfer-md" id="tray-outer">
            <div class="tray-inner chamfer-md">
                <div id="mini-preview"></div>
                <span class="tray-hint">拖曳放置</span>
            </div>
        </div>
        <div class="btn-grid">
            <button id="btn-rotate" onclick="rotateShape()">↻ 旋轉</button>
            <button id="btn-flip" onclick="flipShape()">⇄ 翻轉</button>
            <button id="btn-swap" class="btn-ticket" onclick="toggleSwapMode()">🎫 調換</button>
            <button id="btn-gift" class="btn-gift" onclick="openGiftModal()">🎁 贈送</button>
        </div>
    </div>

    <!-- 輕點棋盤釘選預覽時出現的快速確認欄 -->
    <div id="confirm-bar">
        <button id="btn-confirm-place" onclick="confirmPinnedPlacement()">✓ 確認放置草皮</button>
        <button id="btn-cancel-pin" onclick="clearPinnedPreview()">取消</button>
    </div>

    <!-- 做舊實木外框 + 20x20 石板草皮棋盤 -->
    <div class="board-wood-frame">
        <div class="board-recess">
            <div id="board"></div>
        </div>
    </div>

    <!-- 贈送調換券彈窗 -->
    <div class="modal-overlay" id="gift-modal">
        <div class="modal-box chamfer-md">
            <h3>🎁 轉贈草皮調換券</h3>
            <p style="font-size: 13px; color: #9ca3af; margin: 0;">選擇要將 1 張調換券轉讓給哪位玩家：</p>
            <div class="gift-targets" id="gift-targets"></div>
            <button class="btn-cancel-modal" onclick="closeGiftModal()">取消</button>
        </div>
    </div>

    <!-- 最終勝負結算視窗 -->
    <div class="modal-overlay" id="result-modal">
        <div class="modal-box chamfer-md">
            <h3>🏆 最終勝負結算</h3>
            <div class="winner-banner" id="winner-text"></div>
            <div class="result-list" id="result-details"></div>
            <button onclick="resetGame()" style="width: 100%; background: #22c55e; color: #052e16; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 800; cursor: pointer;">開啟新局</button>
        </div>
    </div>

    <script>
        // 全局攔截 iOS Safari 原生長按選字與右鍵選單
        document.addEventListener('selectstart', (e) => e.preventDefault());
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        const boardElement = document.getElementById('board');
        const miniPreviewElement = document.getElementById('mini-preview');
        const trayOuterElement = document.getElementById('tray-outer');
        const dragGhostElement = document.getElementById('drag-ghost');
        const turnIndicator = document.getElementById('turn-indicator');
        const queueBarElement = document.getElementById('queue-bar');
        const queueListElement = document.getElementById('queue-list');
        const confirmBarElement = document.getElementById('confirm-bar');
        const btnConfirmPlace = document.getElementById('btn-confirm-place');
        const toastElement = document.getElementById('toast');
        const rows = 20;
        const cols = 20;
        let cells = []; 
        let nextPieceUid = 1;

        // ==========================================
        // 內建 Web Audio API 實體音效
        // ==========================================
        let soundEnabled = true;
        let audioCtx = null;

        function playTone(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(260, now + 0.05);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'place') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(190, now);
                    osc.frequency.exponentialRampToValueAtTime(75, now + 0.11);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
                    osc.start(now);
                    osc.stop(now + 0.11);
                } else if (type === 'steal') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(340, now);
                    osc.frequency.linearRampToValueAtTime(620, now + 0.16);
                    gain.gain.setValueAtTime(0.16, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                    osc.start(now);
                    osc.stop(now + 0.18);
                } else if (type === 'achieve') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.setValueAtTime(880, now + 0.09);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
                    osc.start(now);
                    osc.stop(now + 0.32);
                }
            } catch (e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('btn-sound').textContent = soundEnabled ? '🔊' : '🔇';
        }

        const players = [
            { id: 0, name: '玩家 1', colorName: '藍色', cssColor: '#3b82f6', has5x5: false, tileCount: 0, tickets: 1 },
            { id: 1, name: '玩家 2', colorName: '橘色', cssColor: '#f59e0b', has5x5: false, tileCount: 0, tickets: 1 },
            { id: 2, name: '玩家 3', colorName: '紅色', cssColor: '#ef4444', has5x5: false, tileCount: 0, tickets: 1 },
            { id: 3, name: '玩家 4', colorName: '紫色', cssColor: '#a855f7', has5x5: false, tileCount: 0, tickets: 1 }
        ];
        let currentPlayerIndex = 0; 
        let isStealing = false;
        let stealCount = 0;
        let isSwapping = false;
        let pinnedPreview = null;

        const shapePool = [
            [[1, 1, 1], [0, 1, 0]],             // T4
            [[1, 1, 1, 1]],                     // I4
            [[1, 1], [1, 1]],                   // O4
            [[1, 0, 0], [1, 1, 1]],             // L4
            [[0, 0, 1], [1, 1, 1]],             // J4
            [[0, 1, 1], [1, 1, 0]],             // S4
            [[1, 1, 0], [0, 1, 1]],             // Z4
            [[0, 1, 0], [1, 1, 1], [0, 1, 0]],  // X5
            [[1, 0, 1], [1, 1, 1]],             // U5
            [[1, 1, 1], [0, 1, 0], [0, 1, 0]],  // T5
            [[1, 1, 0], [1, 1, 1]],             // P5
            [[1, 1, 1], [1, 0, 0], [1, 0, 0]],  // V5
            [[1, 1, 0], [0, 1, 1], [0, 0, 1]]   // W5
        ];

        let currentShape = [];
        let upcomingShapes = [];

        function getRandomShape() {
            const idx = Math.floor(Math.random() * shapePool.length);
            return JSON.parse(JSON.stringify(shapePool[idx]));
        }

        function initShapeQueue() {
            currentShape = getRandomShape();
            upcomingShapes = [];
            for (let i = 0; i < 5; i++) {
                upcomingShapes.push(getRandomShape());
            }
        }

        function showToast(msg) {
            toastElement.textContent = msg;
            toastElement.classList.add('show');
            setTimeout(() => toastElement.classList.remove('show'), 2500);
        }

        // ==========================================
        // 預告列與按鈕狀態
        // ==========================================
        function renderUpcomingQueue() {
            queueListElement.innerHTML = '';
            queueBarElement.classList.toggle('swap-active', isSwapping);

            upcomingShapes.forEach((shape, idx) => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'queue-item';
                item.onclick = () => handleQueueItemClick(idx);

                const numBadge = document.createElement('span');
                numBadge.className = 'queue-num';
                numBadge.textContent = `#${idx + 1}`;
                item.appendChild(numBadge);

                const grid = document.createElement('div');
                grid.className = 'queue-grid';
                const rLen = shape.length;
                const cLen = shape[0].length;
                grid.style.gridTemplateColumns = `repeat(${cLen}, 5px)`;
                grid.style.gridTemplateRows = `repeat(${rLen}, 5px)`;

                for (let r = 0; r < rLen; r++) {
                    for (let c = 0; c < cLen; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'q-cell';
                        if (shape[r][c] === 1) cell.classList.add('filled');
                        grid.appendChild(cell);
                    }
                }
                item.appendChild(grid);
                queueListElement.appendChild(item);
            });
        }

        function updateControlButtons() {
            const player = players[currentPlayerIndex];
            const btnRotate = document.getElementById('btn-rotate');
            const btnFlip = document.getElementById('btn-flip');
            const btnSwap = document.getElementById('btn-swap');
            const btnGift = document.getElementById('btn-gift');

            if (isStealing) {
                btnRotate.disabled = true;
                btnFlip.disabled = true;
                btnSwap.disabled = true;
                btnGift.disabled = true;
                return;
            }

            btnRotate.disabled = isSwapping;
            btnFlip.disabled = isSwapping;
            btnGift.disabled = isSwapping || player.tickets <= 0;

            if (isSwapping) {
                btnSwap.disabled = false;
                btnSwap.textContent = '✕ 取消調換';
                btnSwap.classList.add('canceling');
            } else {
                btnSwap.disabled = player.tickets <= 0;
                btnSwap.textContent = `🎫 調換 (${player.tickets})`;
                btnSwap.classList.remove('canceling');
            }
        }

        function updateTurnBanner() {
            const player = players[currentPlayerIndex];
            turnIndicator.className = 'chamfer-sm';
            if (isStealing) {
                turnIndicator.textContent = `⚔️ 立即發動搶奪！請點擊對手草皮`;
                turnIndicator.classList.add('banner-steal');
            } else if (isSwapping) {
                turnIndicator.textContent = `🎫 請從上方「後續5片」點擊欲替換的草皮`;
                turnIndicator.classList.add('banner-swap');
            } else {
                turnIndicator.textContent = `輪到 ${player.name} (${player.colorName}) — 拖曳或點擊棋盤`;
                turnIndicator.classList.add(`banner-p${currentPlayerIndex}`);
            }
        }

        // ==========================================
        // 草皮調換券
        // ==========================================
        function toggleSwapMode() {
            if (isStealing) return;
            const player = players[currentPlayerIndex];
            if (!isSwapping && player.tickets <= 0) return;

            playTone('click');
            clearPinnedPreview();
            isSwapping = !isSwapping;
            renderUpcomingQueue();
            updateControlButtons();
            updateTurnBanner();
        }

        function handleQueueItemClick(index) {
            if (!isSwapping) return;

            const player = players[currentPlayerIndex];
            if (player.tickets <= 0) return;

            playTone('click');
            player.tickets--;
            const chosenShape = upcomingShapes.splice(index, 1)[0];
            upcomingShapes.push(getRandomShape());
            currentShape = chosenShape;

            isSwapping = false;
            evaluateBoardState();
            updateMiniPreview();
            renderUpcomingQueue();
            updateControlButtons();
            updateTurnBanner();
            showToast(`🎫 ${player.name} 調換了第 #${index + 1} 片草皮！`);
        }

        function openGiftModal() {
            if (isStealing || isSwapping) return;
            const sender = players[currentPlayerIndex];
            if (sender.tickets <= 0) return;

            playTone('click');
            const targetsContainer = document.getElementById('gift-targets');
            targetsContainer.innerHTML = '';

            players.forEach(p => {
                if (p.id !== sender.id) {
                    const btn = document.createElement('button');
                    btn.className = 'gift-target-btn';
                    btn.style.background = p.cssColor;
                    btn.textContent = `贈送給 ${p.name} (${p.colorName}) — 目前 🎫×${p.tickets}`;
                    btn.onclick = () => executeGiftTicket(p.id);
                    targetsContainer.appendChild(btn);
                }
            });

            document.getElementById('gift-modal').style.display = 'flex';
        }

        function closeGiftModal() {
            playTone('click');
            document.getElementById('gift-modal').style.display = 'none';
        }

        function executeGiftTicket(targetPlayerId) {
            const sender = players[currentPlayerIndex];
            const receiver = players[targetPlayerId];
            if (sender.tickets <= 0) return;

            playTone('click');
            sender.tickets--;
            receiver.tickets++;

            closeGiftModal();
            evaluateBoardState();
            updateControlButtons();
            showToast(`🎁 ${sender.name} 將調換券贈送給了 ${receiver.name}！`);
        }

        // ==========================================
        // 回合推進
        // ==========================================
        function nextTurn() {
            isSwapping = false;
            clearPinnedPreview();
            document.getElementById(`card-p${currentPlayerIndex}`).classList.remove('active-turn');
            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            document.getElementById(`card-p${currentPlayerIndex}`).classList.add('active-turn');

            currentShape = upcomingShapes.shift();
            upcomingShapes.push(getRandomShape());
            
            updateTurnBanner();
            updateMiniPreview();
            renderUpcomingQueue();
            updateControlButtons();
        }

        // ==========================================
        // 物理拼圖外框與 5x5 演算法
        // ==========================================
        function updatePieceContours() {
            const seenPieces = new Set();
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = cells[r][c];
                    cell.classList.remove('edge-top', 'edge-right', 'edge-bottom', 'edge-left', 'piece-anchor');

                    const pid = cell.dataset.pieceId;
                    if (!pid) continue;

                    if (!seenPieces.has(pid)) {
                        seenPieces.add(pid);
                        cell.classList.add('piece-anchor');
                    }
                    if (r === 0 || cells[r - 1][c].dataset.pieceId !== pid) cell.classList.add('edge-top');
                    if (c === cols - 1 || cells[r][c + 1].dataset.pieceId !== pid) cell.classList.add('edge-right');
                    if (r === rows - 1 || cells[r + 1][c].dataset.pieceId !== pid) cell.classList.add('edge-bottom');
                    if (c === 0 || cells[r][c - 1].dataset.pieceId !== pid) cell.classList.add('edge-left');
                }
            }
        }

        function evaluateBoardState() {
            updatePieceContours();

            document.querySelectorAll('.board-5x5-badge').forEach(el => el.remove());
            const owner5x5Map = Array.from({ length: rows }, () => Array(cols).fill(-1));

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    cells[r][c].classList.remove('in-5x5', 'glow-top', 'glow-right', 'glow-bottom', 'glow-left');
                }
            }

            players.forEach(player => {
                const pClass = `placed-p${player.id}`;
                let totalTiles = 0;
                let found5x5 = false;
                let badgeAnchor = null;

                const dp = Array.from({ length: rows }, () => Array(cols).fill(0));

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (cells[r][c].classList.contains(pClass)) {
                            totalTiles++;
                            if (r === 0 || c === 0) {
                                dp[r][c] = 1;
                            } else {
                                dp[r][c] = Math.min(dp[r - 1][c], dp[r][c - 1], dp[r - 1][c - 1]) + 1;
                            }

                            if (dp[r][c] >= 5) {
                                found5x5 = true;
                                if (!badgeAnchor) badgeAnchor = { r: r - 4, c: c - 4 };
                                for (let rr = r - 4; rr <= r; rr++) {
                                    for (let cc = c - 4; cc <= c; cc++) {
                                        owner5x5Map[rr][cc] = player.id;
                                        cells[rr][cc].classList.add('in-5x5');
                                    }
                                }
                            }
                        }
                    }
                }

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (owner5x5Map[r][c] === player.id) {
                            if (r === 0 || owner5x5Map[r - 1][c] !== player.id) cells[r][c].classList.add('glow-top');
                            if (c === cols - 1 || owner5x5Map[r][c + 1] !== player.id) cells[r][c].classList.add('glow-right');
                            if (r === rows - 1 || owner5x5Map[r + 1][c] !== player.id) cells[r][c].classList.add('glow-bottom');
                            if (c === 0 || owner5x5Map[r][c - 1] !== player.id) cells[r][c].classList.add('glow-left');
                        }
                    }
                }

                if (badgeAnchor) {
                    const badgeEl = document.createElement('div');
                    badgeEl.className = 'board-5x5-badge';
                    badgeEl.style.borderColor = player.cssColor;
                    badgeEl.textContent = `P${player.id + 1} · 5×5`;
                    if (badgeAnchor.r === 0) {
                        badgeEl.style.transform = 'translate(2px, 2px)';
                    }
                    cells[badgeAnchor.r][badgeAnchor.c].appendChild(badgeEl);
                }

                if (!player.has5x5 && found5x5) {
                    playTone('achieve');
                    showToast(`🎉 ${player.name} (${player.colorName}) 達成了 5×5 領地條件！`);
                } else if (player.has5x5 && !found5x5) {
                    showToast(`💥 ${player.name} (${player.colorName}) 的 5×5 領地被破壞了！`);
                }

                player.tileCount = totalTiles;
                player.has5x5 = found5x5;

                document.getElementById(`tiles-p${player.id}`).textContent = `${totalTiles}格`;
                document.getElementById(`tickets-p${player.id}`).textContent = `🎫×${player.tickets}`;
                
                const badge = document.getElementById(`badge-p${player.id}`);
                if (found5x5) {
                    badge.textContent = '5×5 達成';
                    badge.classList.add('qualified');
                } else {
                    badge.textContent = '未達 5×5';
                    badge.classList.remove('qualified');
                }
            });
        }

        function endGame() {
            if (isStealing) {
                showToast('請先完成當前的搶奪行動！');
                return;
            }
            playTone('click');
            evaluateBoardState();

            const qualifiedPlayers = players.filter(p => p.has5x5);
            const rankedPlayers = [...players].sort((a, b) => {
                if (a.has5x5 !== b.has5x5) return b.has5x5 ? 1 : -1;
                return b.tileCount - a.tileCount;
            });

            const winnerBanner = document.getElementById('winner-text');
            if (qualifiedPlayers.length === 0) {
                winnerBanner.textContent = '無人達成 5×5 領地，全員未達標！';
                winnerBanner.style.color = '#ef4444';
            } else {
                const topTiles = rankedPlayers[0].tileCount;
                const winners = qualifiedPlayers.filter(p => p.tileCount === topTiles);
                const winnerNames = winners.map(w => `${w.name}(${w.colorName})`).join('、');
                winnerBanner.textContent = `勝者：${winnerNames} (${topTiles} 格)`;
                winnerBanner.style.color = '#d8ff2e';
            }

            const detailsHTML = rankedPlayers.map((p, idx) => {
                const status = p.has5x5 ? '✅ 5×5達成' : '❌ 未達5×5';
                return `<div><strong style="color:${p.cssColor}">第 ${idx + 1} 名：${p.name} (${p.colorName})</strong> — ${p.tileCount} 格 ｜ ${status}</div>`;
            }).join('');

            document.getElementById('result-details').innerHTML = detailsHTML;
            document.getElementById('result-modal').style.display = 'flex';
        }

        function resetGame() {
            playTone('click');
            document.getElementById('result-modal').style.display = 'none';
            boardElement.innerHTML = '';
            cells = [];
            nextPieceUid = 1;
            currentPlayerIndex = 0;
            isStealing = false;
            stealCount = 0;
            isSwapping = false;
            clearPinnedPreview();

            players.forEach((p, idx) => {
                p.has5x5 = false;
                p.tileCount = 0;
                p.tickets = 1;
                const card = document.getElementById(`card-p${idx}`);
                card.classList.toggle('active-turn', idx === 0);
            });

            trayOuterElement.style.opacity = 1;

            createBoard();
            initShapeQueue();
            evaluateBoardState();
            updateTurnBanner();
            updateMiniPreview();
            renderUpcomingQueue();
            updateControlButtons();
        }

        // --- 旋轉、翻轉與托盤草皮渲染 ---
        function rotateShape() {
            if (isStealing || isSwapping) return;
            playTone('click');
            const newShape = [];
            const rLen = currentShape.length;
            const cLen = currentShape[0].length;
            for (let c = 0; c < cLen; c++) {
                newShape[c] = [];
                for (let r = rLen - 1; r >= 0; r--) {
                    newShape[c].push(currentShape[r][c]);
                }
            }
            currentShape = newShape;
            updateMiniPreview();
            refreshPinnedPreview();
        }

        function flipShape() {
            if (isStealing || isSwapping) return; 
            playTone('click');
            for (let r = 0; r < currentShape.length; r++) {
                currentShape[r].reverse();
            }
            updateMiniPreview();
            refreshPinnedPreview();
        }

        function updateMiniPreview() {
            miniPreviewElement.innerHTML = '';
            const rLen = currentShape.length;
            const cLen = currentShape[0].length;
            
            trayOuterElement.style.background = players[currentPlayerIndex].cssColor;
            miniPreviewElement.style.gridTemplateColumns = `repeat(${cLen}, 11px)`;
            miniPreviewElement.style.gridTemplateRows = `repeat(${rLen}, 11px)`;

            for (let r = 0; r < rLen; r++) {
                for (let c = 0; c < cLen; c++) {
                    const miniCell = document.createElement('div');
                    miniCell.classList.add('mini-cell');
                    if (currentShape[r][c] === 1) {
                        miniCell.classList.add('filled');
                    }
                    miniPreviewElement.appendChild(miniCell);
                }
            }
        }

        // 渲染跟隨手指的浮動草皮幽靈
        function showDragGhost(clientX, clientY) {
            dragGhostElement.innerHTML = '';
            const rLen = currentShape.length;
            const cLen = currentShape[0].length;
            dragGhostElement.style.display = 'grid';
            dragGhostElement.style.gridTemplateColumns = `repeat(${cLen}, 18px)`;
            dragGhostElement.style.gridTemplateRows = `repeat(${rLen}, 18px)`;

            for (let r = 0; r < rLen; r++) {
                for (let c = 0; c < cLen; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'ghost-cell';
                    if (currentShape[r][c] === 1) cell.classList.add('filled');
                    dragGhostElement.appendChild(cell);
                }
            }
            moveDragGhost(clientX, clientY);
        }

        function moveDragGhost(clientX, clientY) {
            dragGhostElement.style.left = `${clientX}px`;
            dragGhostElement.style.top = `${clientY}px`;
        }

        function hideDragGhost() {
            dragGhostElement.style.display = 'none';
        }

        function createBoard() {
            for (let r = 0; r < rows; r++) {
                cells[r] = [];
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    boardElement.appendChild(cell);
                    cells[r][c] = cell;
                }
            }
            placeRandomTiles('stone', 15);
            placeRandomTiles('steal-card', 5);
        }

        function placeRandomTiles(className, count) {
            let placed = 0;
            while (placed < count) {
                const r = Math.floor(Math.random() * rows);
                const c = Math.floor(Math.random() * cols);
                const cell = cells[r][c];
                if (!cell.classList.contains('stone') && !cell.classList.contains('steal-card')) {
                    cell.classList.add(className);
                    placed++;
                }
            }
        }

        // ==========================================
        // iOS Safari 強化觸控 & 滑鼠雙模操控引擎
        // ==========================================
        let activeDragSource = null; // 'tray' | 'board' | null
        let touchStartX = 0;
        let touchStartY = 0;
        let hasMovedSignificantly = false;
        let lastPreviewStart = null;

        function getCellCoordFromClient(clientX, clientY, verticalLiftCells = 0) {
            const rect = boardElement.getBoundingClientRect();
            const cellSize = rect.width / cols;
            const adjustedY = clientY - verticalLiftCells * cellSize;

            if (clientX < rect.left || clientX > rect.right || adjustedY < rect.top || adjustedY > rect.bottom) {
                return null;
            }
            const col = Math.min(cols - 1, Math.max(0, Math.floor((clientX - rect.left) / cellSize)));
            const row = Math.min(rows - 1, Math.max(0, Math.floor((adjustedY - rect.top) / cellSize)));
            return { row, col };
        }

        function getCenteredShapeOrigin(centerRow, centerCol) {
            const h = currentShape.length;
            const w = currentShape[0].length;
            let startRow = centerRow - Math.floor(h / 2);
            let startCol = centerCol - Math.floor(w / 2);
            startRow = Math.max(0, Math.min(rows - h, startRow));
            startCol = Math.max(0, Math.min(cols - w, startCol));
            return { startRow, startCol };
        }

        function isPlacementValid(startRow, startCol) {
            for (let r = 0; r < currentShape.length; r++) {
                for (let c = 0; c < currentShape[r].length; c++) {
                    if (currentShape[r][c] === 1) {
                        const tr = startRow + r;
                        const tc = startCol + c;
                        if (tr < 0 || tr >= rows || tc < 0 || tc >= cols ||
                            cells[tr][tc].classList.contains('placed') ||
                            cells[tr][tc].classList.contains('stone')) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function clearPreview() {
            const previewClasses = ['preview-invalid', 'preview-valid-p0', 'preview-valid-p1', 'preview-valid-p2', 'preview-valid-p3', 'steal-target-preview'];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    cells[r][c].classList.remove(...previewClasses);
                }
            }
        }

        function drawPreview(startRow, startCol) {
            clearPreview();
            const isValid = isPlacementValid(startRow, startCol);
            const validClass = `preview-valid-p${currentPlayerIndex}`;

            for (let r = 0; r < currentShape.length; r++) {
                for (let c = 0; c < currentShape[r].length; c++) {
                    if (currentShape[r][c] === 1) {
                        const tr = startRow + r;
                        const tc = startCol + c;
                        if (tr >= 0 && tr < rows && tc >= 0 && tc < cols && !cells[tr][tc].classList.contains('placed')) {
                            cells[tr][tc].classList.add(isValid ? validClass : 'preview-invalid');
                        }
                    }
                }
            }
            return isValid;
        }

        function setPinnedPreview(startRow, startCol) {
            pinnedPreview = { startRow, startCol };
            const valid = drawPreview(startRow, startCol);
            confirmBarElement.classList.add('visible');
            btnConfirmPlace.disabled = !valid;
            btnConfirmPlace.textContent = valid ? '✓ 確認放置草皮' : '✕ 此位置無法放置';
        }

        function refreshPinnedPreview() {
            if (!pinnedPreview) return;
            const { startRow, startCol } = getCenteredShapeOrigin(
                pinnedPreview.startRow + Math.floor(currentShape.length / 2),
                pinnedPreview.startCol + Math.floor(currentShape[0].length / 2)
            );
            setPinnedPreview(startRow, startCol);
        }

        function clearPinnedPreview() {
            pinnedPreview = null;
            confirmBarElement.classList.remove('visible');
            clearPreview();
        }

        function confirmPinnedPlacement() {
            if (!pinnedPreview) return;
            const { startRow, startCol } = pinnedPreview;
            if (isPlacementValid(startRow, startCol)) {
                clearPinnedPreview();
                placeShape(startRow, startCol);
            }
        }

        function onInteractionStart(source, clientX, clientY, isTouch) {
            if (isSwapping) return;
            if (window.getSelection) {
                try { window.getSelection().removeAllRanges(); } catch (e) {}
            }

            activeDragSource = source;
            touchStartX = clientX;
            touchStartY = clientY;
            hasMovedSignificantly = false;
            lastPreviewStart = null;

            if (source === 'tray' && !isStealing) {
                showDragGhost(clientX, clientY);
            }

            const lift = isTouch ? (source === 'tray' ? 1.8 : 0.9) : 0;
            const coord = getCellCoordFromClient(clientX, clientY, lift);

            if (isStealing) {
                clearPreview();
                if (coord) {
                    const cell = cells[coord.row][coord.col];
                    if (cell.classList.contains('placed') && !cell.classList.contains(`placed-p${currentPlayerIndex}`)) {
                        cell.classList.add('steal-target-preview');
                    }
                }
                return;
            }

            if (coord) {
                const origin = getCenteredShapeOrigin(coord.row, coord.col);
                lastPreviewStart = origin;
                drawPreview(origin.startRow, origin.startCol);
            }
        }

        function onInteractionMove(clientX, clientY, isTouch) {
            if (!activeDragSource || isSwapping) return;

            if (activeDragSource === 'tray') {
                moveDragGhost(clientX, clientY);
            }

            if (Math.hypot(clientX - touchStartX, clientY - touchStartY) > 8) {
                hasMovedSignificantly = true;
                if (pinnedPreview) {
                    pinnedPreview = null;
                    confirmBarElement.classList.remove('visible');
                }
            }

            const lift = isTouch ? (activeDragSource === 'tray' ? 1.8 : 0.9) : 0;
            const coord = getCellCoordFromClient(clientX, clientY, lift);

            if (isStealing) {
                clearPreview();
                if (coord) {
                    const cell = cells[coord.row][coord.col];
                    if (cell.classList.contains('placed') && !cell.classList.contains(`placed-p${currentPlayerIndex}`)) {
                        cell.classList.add('steal-target-preview');
                    }
                }
                return;
            }

            if (coord) {
                // 一旦拖進棋盤範圍內，隱藏手指幽靈改用精準棋盤網格預覽
                if (activeDragSource === 'tray') hideDragGhost();
                const origin = getCenteredShapeOrigin(coord.row, coord.col);
                lastPreviewStart = origin;
                drawPreview(origin.startRow, origin.startCol);
            } else {
                if (activeDragSource === 'tray') showDragGhost(clientX, clientY);
                lastPreviewStart = null;
                clearPreview();
            }
        }

        function onInteractionEnd(clientX, clientY, isTouch) {
            if (!activeDragSource || isSwapping) return;
            const source = activeDragSource;
            activeDragSource = null;
            hideDragGhost();

            const lift = isTouch ? (source === 'tray' ? 1.8 : 0.9) : 0;
            const coord = getCellCoordFromClient(clientX, clientY, lift);

            if (isStealing) {
                clearPreview();
                if (coord) {
                    executeSteal(cells[coord.row][coord.col]);
                }
                return;
            }

            if (source === 'tray') {
                if (!hasMovedSignificantly) {
                    rotateShape();
                    return;
                }
                if (lastPreviewStart && isPlacementValid(lastPreviewStart.startRow, lastPreviewStart.startCol)) {
                    clearPinnedPreview();
                    placeShape(lastPreviewStart.startRow, lastPreviewStart.startCol);
                } else {
                    clearPreview();
                }
                return;
            }

            if (source === 'board') {
                if (hasMovedSignificantly) {
                    if (lastPreviewStart && isPlacementValid(lastPreviewStart.startRow, lastPreviewStart.startCol)) {
                        clearPinnedPreview();
                        placeShape(lastPreviewStart.startRow, lastPreviewStart.startCol);
                    } else if (lastPreviewStart) {
                        setPinnedPreview(lastPreviewStart.startRow, lastPreviewStart.startCol);
                    } else {
                        clearPreview();
                    }
                } else if (coord) {
                    const origin = getCenteredShapeOrigin(coord.row, coord.col);
                    if (pinnedPreview && pinnedPreview.startRow === origin.startRow && pinnedPreview.startCol === origin.startCol) {
                        if (isPlacementValid(origin.startRow, origin.startCol)) {
                            clearPinnedPreview();
                            placeShape(origin.startRow, origin.startCol);
                        }
                    } else {
                        playTone('click');
                        setPinnedPreview(origin.startRow, origin.startCol);
                    }
                }
            }
        }

        // 綁定觸控事件
        trayOuterElement.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            onInteractionStart('tray', t.clientX, t.clientY, true);
        }, { passive: false });

        boardElement.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            onInteractionStart('board', t.clientX, t.clientY, true);
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (!activeDragSource) return;
            e.preventDefault();
            const t = e.touches[0];
            onInteractionMove(t.clientX, t.clientY, true);
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (!activeDragSource) return;
            const t = e.changedTouches[0];
            onInteractionEnd(t.clientX, t.clientY, true);
        });

        document.addEventListener('touchcancel', () => {
            activeDragSource = null;
            hideDragGhost();
            clearPreview();
        });

        // 綁定滑鼠事件
        trayOuterElement.addEventListener('mousedown', (e) => {
            onInteractionStart('tray', e.clientX, e.clientY, false);
        });
        boardElement.addEventListener('mousedown', (e) => {
            onInteractionStart('board', e.clientX, e.clientY, false);
        });
        window.addEventListener('mousemove', (e) => {
            if (!activeDragSource) return;
            onInteractionMove(e.clientX, e.clientY, false);
        });
        window.addEventListener('mouseup', (e) => {
            if (!activeDragSource) return;
            onInteractionEnd(e.clientX, e.clientY, false);
        });

        // --- 搶奪與放置結算 ---
        function countStealableTargets() {
            let count = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (cells[r][c].classList.contains('placed') && !cells[r][c].classList.contains(`placed-p${currentPlayerIndex}`)) {
                        count++;
                    }
                }
            }
            return count;
        }

        function executeSteal(targetCell) {
            if (targetCell.classList.contains('placed') && !targetCell.classList.contains(`placed-p${currentPlayerIndex}`)) {
                playTone('place');
                for (let i = 0; i < players.length; i++) {
                    targetCell.classList.remove(`placed-p${i}`);
                }
                targetCell.classList.add(`placed-p${currentPlayerIndex}`);
                targetCell.dataset.pieceId = `stolen-${nextPieceUid++}`;
                
                targetCell.style.transform = 'scale(1.25)';
                setTimeout(() => targetCell.style.transform = 'scale(1)', 200);

                evaluateBoardState();

                stealCount--;
                if (stealCount === 0 || countStealableTargets() === 0) {
                    isStealing = false;
                    trayOuterElement.style.opacity = 1;
                    nextTurn(); 
                }
            }
        }

        function placeShape(startRow, startCol) {
            if (!isPlacementValid(startRow, startCol)) return;

            let stealCardsTriggered = 0;
            const thisPieceId = `piece-${nextPieceUid++}`;

            for (let r = 0; r < currentShape.length; r++) {
                for (let c = 0; c < currentShape[r].length; c++) {
                    if (currentShape[r][c] === 1) {
                        const targetCell = cells[startRow + r][startCol + c];
                        if (targetCell.classList.contains('steal-card')) {
                            stealCardsTriggered++;
                            targetCell.classList.remove('steal-card'); 
                        }
                        targetCell.classList.add('placed', `placed-p${currentPlayerIndex}`);
                        targetCell.dataset.pieceId = thisPieceId;
                    }
                }
            }

            playTone('place');
            evaluateBoardState();
            
            if (stealCardsTriggered > 0) {
                let possibleTargets = countStealableTargets();
                stealCount = Math.min(stealCardsTriggered, possibleTargets);
                
                if (stealCount > 0) {
                    playTone('steal');
                    isStealing = true;
                    trayOuterElement.style.opacity = 0.25;
                    updateTurnBanner();
                    updateControlButtons();
                } else {
                    showToast("覆蓋了搶奪卡，但場上沒有對手草皮可搶！");
                    nextTurn();
                }
            } else {
                nextTurn();
            }
        }

        // 初始化啟動
        createBoard();
        initShapeQueue();
        evaluateBoardState();
        updateTurnBanner();
        updateMiniPreview();
        renderUpcomingQueue();
        updateControlButtons();
    </script>
</body>
</html>
